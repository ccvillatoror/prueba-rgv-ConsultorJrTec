{% extends "base.html" %} {% block title %} Nuevo pago {% endblock %} {% block content
%} 

<h1 align="center">Nuevo Pago</h1>
 
<form method="POST">
  <h3> Ingrese los datos para un nuevo pago</h3>
  <div class="form-group">
    <label for="fecha-pago">Fecha (si se deja vacío, al pago se le asignará la fecha de hoy)</label>
    <input
      type="date"
      class="form-control"
      id="fecha-pago"
      name="fecha-pago"
    />
  </div>
  <div class="form-group">
    <label for="gasto-relacionado">Número de gasto relacionado</label>
    <select id="gasto-relacionado" name="gasto-relacionado">
        {% for gasto in gastos_aprobados %}
        <option value="{{ gasto.id }}" {% if gasto.id == gasto_seleccionado %}selected{% endif %} >{{ gasto.id }} - {{ gasto.concepto }}</option>
        {% else %}
        <option value="" disabled selected>No hay gastos aprobados</option>
        {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label for="monto-pagado">Monto a pagar</label>
    <input
      type="number"
      class="form-control"
      id="monto-pagado"
      name="monto-pagado"
      min="0.00" 
      step="0.01" 
      placeholder="0.00"
      required
    />
  </div>  
  <div class="form-group">
    <label for="cuenta-asociada">Cuenta de origen</label>
    <select id="cuenta-asociada" name="cuenta-asociada">
        {% for cuenta in cuentas %}
        <option value="{{ cuenta.id }}">Cuenta {{ cuenta.id }} - Saldo: ${{ "%.2f"|format(cuenta.saldo) }}</option>
        {% else %}
        <option value="" disabled selected>No hay cuentas disponibles</option>
        {% endfor %}
    </select>
  </div>
  <br />
  <button type="submit" class="btn btn-primary">Guardar pago</button>
</form>

{% endblock %}
