{% extends "base.html" %} {% block title %} Nuevo pago {% endblock %} {% block content
%} 

<h1 align="center">Nuevo Pago</h1>

<form method="POST">
  <h3> Ingrese los datos para un nuevo pago</h3>
  <div class="form-group">
    <label for="fecha">Fecha</label>
    <input
      type="date"
      class="form-control"
      id="fecha-gasto"
      name="fecha-gasto"
    />
  </div>
  <div class="form-group">
    <label for="gasto-relacionado">Número de gasto relacionado</label>
    <select id="gasto-relacionado" name="gasto-relacionado">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>
  </div>
  <div class="form-group">
    <label for="monto-gastado">Monto gastado</label>
    <input
      type="number"
      class="form-control"
      id="monto-gasto"
      name="monto-gasto"
      min="0.00" 
      step="0.01" 
      placeholder="0.00"
      required
    />
  </div>  
  <div class="form-group">
    <label for="cuenta-asociada">Cuenta de origen</label>
    <select id="cuenta-asociada" name="cuenta-asociada">
        <option value="1">1</option>
        <option value="2">2</option>
    </select>
  </div>
  <br />
  <button type="submit" class="btn btn-primary">Guardar pago</button>
</form>
{% endblock %}
