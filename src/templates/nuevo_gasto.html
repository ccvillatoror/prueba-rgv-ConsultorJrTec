{% extends "base.html" %} {% block title %}Registrar nuevo Gastoendblock {% endblock %} {% block content
%} 

<h1 align="center">Nuevo pago</h1>

<form method="POST">
  <h3> Ingresa los datos para un nuevo gasto</h3>
  <div class="form-group">
    <label for="concepto-gasto">Concepto</label>
    <input
      type="text"
      class="form-control"
      id="concepto-gasto"
      name="concepto-gasto"
      placeholder="Ingrese el concepto del gasto"
      required
    />
  </div>
  <div class="form-group">
    <label for="fecha-gasto">Fecha</label>
    <input
      type="date"
      class="form-control"
      id="fecha-gasto"
      name="fecha-gasto"
    />
  </div>
  <div class="form-group">
    <label for="monto-gastado">Monto gastado</label>
    <input
      type="number"
      class="form-control"
      id="monto-gasto"
      name="monto-gasto"
      min="0.00" 
      step="0.01" 
      placeholder="0.00"
      required
    />
  </div><div class="form-group">
    <label for="monto-gastado">Monto gastado</label>
    <input
      type="number"
      class="form-control"
      id="monto-gasto"
      name="monto-gasto"
      min="0.00" 
      step="0.01" 
      placeholder="0.00"
      required
    />
  </div>
  <br />
  <button type="submit" class="btn btn-primary">Guardar gasto</button>
</form>
{% endblock %}
